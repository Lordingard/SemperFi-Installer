name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check public source contents
        run: python scripts/check-public-content.py
      - name: Build Windows tools
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test French and English tools
        shell: pwsh
        run: ./scripts/test-localization.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SemperFi-Installer-windows
          path: bin/
